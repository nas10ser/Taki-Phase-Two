<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تاكي — لا يوجد اتصال</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, "Noto Kufi Arabic", sans-serif;
    text-align: center;
  }
  .card { max-width: 420px; width: 100%; }
  .glyph {
    width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 28px;
    background: linear-gradient(135deg, #1e293b, #334155);
    display: grid; place-items: center; font-size: 2.6rem;
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
  }
  h1 { font-size: 1.35rem; font-weight: 900; margin: 0 0 10px; letter-spacing: -.2px; }
  p { margin: 0 0 8px; font-size: .95rem; font-weight: 600; line-height: 1.95; color: #94a3b8; }
  ul { margin: 18px 0 0; padding: 0; list-style: none; text-align: start; }
  li {
    display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; margin-bottom: 8px;
    background: rgba(148,163,184,.10); border: 1px solid rgba(148,163,184,.18);
    border-radius: 14px; font-size: .84rem; font-weight: 700; color: #cbd5e1; line-height: 1.8;
  }
  button {
    margin-top: 22px; width: 100%; padding: 15px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;
    font-size: 1rem; font-weight: 900; font-family: inherit; cursor: pointer;
  }
  button[disabled] { opacity: .55; cursor: default; }
  .state { margin-top: 14px; font-size: .8rem; font-weight: 800; min-height: 1.2em; color: #94a3b8; }
  .online { color: #34d399; }
  @media (prefers-color-scheme: light) {
    body { background: #f8fafc; color: #0f172a; }
    p, li { color: #475569; }
    .glyph { background: linear-gradient(135deg,#e2e8f0,#cbd5e1); box-shadow: 0 18px 40px rgba(15,23,42,.10); }
    li { background: #fff; border-color: #e2e8f0; }
    .state { color: #64748b; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glyph">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تاكي مفتوح على جهازك، لكن لا يستطيع الوصول إلى الخادم الآن.</p>
    <ul>
      <li><span>📶</span><span>تأكّد من بيانات الجوال أو الواي فاي</span></li>
      <li><span>✈️</span><span>تأكّد أن وضع الطيران مغلق</span></li>
      <li><span>🎫</span><span>باركود حجزك السابق يعمل بلا إنترنت — أرِه للتاجر كما هو</span></li>
    </ul>
    <button id="retry" type="button">إعادة المحاولة</button>
    <div class="state" id="state"></div>
  </div>
<script>
  var btn = document.getElementById('retry');
  var state = document.getElementById('state');
  function go() {
    btn.disabled = true;
    state.textContent = 'جارٍ المحاولة…';
    // `reload` وحده قد يُعيد نفس الصفحة من المخزون. نطلب الجذر صراحةً.
    location.replace('/');
  }
  btn.addEventListener('click', go);
  // عودة الشبكة تُعيده وحدها، فلا ينتظر أمام شاشة ميّتة وهو متصل.
  window.addEventListener('online', function () {
    state.className = 'state online';
    state.textContent = '✅ عاد الاتصال — جارٍ الفتح…';
    setTimeout(go, 600);
  });
</script>
</body>
</html>
