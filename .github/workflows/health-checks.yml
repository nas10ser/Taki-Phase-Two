# ═══════════════════════════════════════════════════════════════════════════
# الفحوص الأربعة (v14.53) — تعمل على خوادم GitHub، خارج كل ما تفحصه
# ═══════════════════════════════════════════════════════════════════════════
# طلب ناصر: صحّة البوت · نجاح الوظائف المجدولة · قراءة صفّ حقيقي من القاعدة ·
# القرص والذاكرة وحجم القاعدة — وتنبيهٌ يصله.
#
# التنبيه: فشلُ أي خطوة يُفشل المهمّة، وGitHub يرسل بريداً لمالك المستودع
# (نفس القناة التي تعمل بها مراقبة التوقّف منذ أغسطس)، **ويُضاف إليه** بريدٌ
# مباشرٌ من داخل السير عبر Resend في الخطوة الأخيرة — بعنوانٍ يقول ما سقط
# ورابطٍ يفتح السجلّ. ويعمل فقط إن وُجد سرّا المستودع `RESEND_API_KEY` و
# `ALERT_EMAIL`، وإلّا تخطّى بتحذيرٍ بلا إفشالِ شيء.
#
# 🔑 **ولا سرّ في هذا الملف ولا في إعدادات المستودع.** المستودع عام، ووضعُ
# مفتاح SSH أو كلمة قاعدة فيه غير وارد. فالمسارات كلها بلا سرّ:
#   • البوت: نقطة `/health` عامّة.
#   • القرص والذاكرة والوظائف: **الخادم يدفع نبضه** إلى قاعدته كل عشر دقائق،
#     وهنا نقرأ **الحكم** لا الأرقام (`system_health_public`). وفضلُ هذا
#     الاتجاه أنه يكشف سقوط الخادم: لا نبضَ ⇒ «قديم» ⇒ إنذار.
#   • قراءة صفّ حقيقي: المفتاح العلني يُستخرج من **حزمة الموقع المنشورة** —
#     فلا يُخزَّن هنا، ونُثبت في الوقت نفسه أن مفتاح الموقع الحيّ يعمل فعلاً.
#
# ⚠️ الجدولة تعمل من الفرع الافتراضي (main) وحده — شرط GitHub Actions.
#
# 🔴 **ولا تُصدّق الرقم في `cron` أدناه.** أُعيد القياسُ ٨ نوفمبر ٢٠٢٦ على آخر
# ١٠٠ تشغيلٍ مجدوَلٍ لهذا السير (٢٠ أكتوبر ← ٨ نوفمبر · ٩٩ فجوة):
#   أصغرُها ١١٥٫٨ دقيقة · **الوسيطُ ٢٩١٫٠** · ٩٠٪ ٤١٥٫٧ · أكبرُها ٦٢٠٫٠ ·
#   و**٩٩/٩٩ فجوةً تتجاوز الساعة**. أي أنّ «كلَّ ربع ساعة» لم تتحقّق ولا مرّة،
#   وأنّ ما سجّلته CLAUDE.md (٢٠٥ دقيقةً وسيطاً) **تردّى ٤٠٪**.
# جدولةُ GitHub Actions **بذلُ أفضل لا ضمان**، وتُخنق على الحسابات المجانية،
# **ولا تُصلح**. فهذا السير طبقةٌ خارجيةٌ بطيئة — قيمتُها أنها ترى ما لا يراه
# الخادم (موتَه هو)، لا أنها سريعة.
#
# 🔴 **وكان هنا وعدٌ كاذبٌ حُذف**: «وتنبيهُه يصل تيليجرام خلال ثوانٍ — v14.55».
# قِيس في ٨ نوفمبر ٢٠٢٦: تلك الساقُ **لم تُسلّم ولا مرّةً واحدة**. سببان
# مستقلّان، فإصلاحُ أحدِهما وحده لا يُغيّر شيئاً:
#   (١) مفتاحُ إطفاء البوت (المقصودُ به حركةُ البوت **الداخلة**) يُسكت
#       التنبيهاتِ **الخارجة** أيضاً، و**يُتلفها**: `server/bot.js` ينادي
#       `bot_pull_outbox` — وهي تختم `bot_pushed_at = now()` على كلّ صفٍّ
#       تسحبه بلا شرط — **ثمّ** يسأل إن كان البوتُ مُفعَّلاً. فمع الإطفاء
#       يُختم الصفُّ «مُسلَّماً» ويُرمى. قِيس: ٣٣ تنبيهاً كلُّها مختومة، صفرُ
#       إرسال.
#   (٢) وقرارُ ناصر ٨ نوفمبر ٢٠٢٦: **لا تيليجرام ولا واتساب في البداية**،
#       وv15.80 مسحت كلَّ معرِّفاتهما وأضافت حارساً يرفض تفعيلَ القناة حتى
#       يُعاد إفصاحُها في سياسة الخصوصيّة (`BOT_CHANNEL_NOT_DISCLOSED`).
# ⇒ ساقُ تيليجرام **خارج الحساب**، ولا يُبنى عليها شيء ولا تُذكر كقناةٍ عاملة.
#
# الكشفُ السريعُ مكانُه كرونُ الخادم (`/usr/local/sbin/taki-heartbeat.sh` كلَّ
# عشر دقائق، مُثبَتُ الانضباط)، **وتنبيهُه يخرج بريداً من القاعدة نفسها إلى
# `api.resend.com`** عبر `public.taki_alert_dispatch` — لا يمرّ بالبوت ولا
# بمفتاح إطفائه ولا بصندوقه الصادر.
# 🪤 وهو داخلَ الصندوق، فلا يستطيع الإبلاغَ عن موتِ الصندوق. ذاك عملُ هذا
#    السيرِ ومراقبةِ التوقّف معاً — وهما وحدَهما.
name: الفحوص الأربعة

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ── ١ · صحّة البوت ────────────────────────────────────────────────────
      - name: ١ · البوت حيّ ويخدم
        run: |
          set -uo pipefail
          # 🪤 `code=$(curl …) || code=000` وليس `|| echo 000`: الثانية تُلحق
          # الرمزين فتصير "200000" وتُنتج إنذاراً كاذباً (درس مسجّل في المراقبة).
          # 🔴 v15.34 — محاولةٌ واحدة كانت تُنتج إنذاراً كاذباً. قِيس على سجلّ
          # الخادم: ٣٧٢٨ نبضةً وفشلٌ واحدٌ معزول (٠٫٠٢٧٪) سببُه إعادةُ تشغيلٍ
          # تفعلها Render وحدها (خطّة free)، والإقلاعُ البارد يتجاوز المهلة.
          # وقاعدةُ تاكي في القاعدة صارت تشترط نبضتين — ولو بقيت هذه الخطوة
          # بمحاولةٍ واحدة لصار الضجيجُ نفسُه يصل بقناةِ بريدِ GitHub.
          # 🪤 ثلاثُ محاولاتٍ بفاصل ٤٠ث تتجاوز إقلاعَ Render البارد (≈٥٠ث)
          #    ولا تُخفي عطلاً حقيقياً: مجموعُ الانتظار دون دقيقتين.
          body=""
          for try_n in 1 2 3; do
            body=$(curl -fsS --max-time 30 https://taki-bot-l0ll.onrender.com/health) || body=""
            [ -n "$body" ] && break
            echo "محاولة $try_n لم تنجح — إعادة بعد 40ث"
            [ "$try_n" -lt 3 ] && sleep 40
          done
          [ -n "$body" ] || { echo "::error::البوت لا يستجيب بعد ٣ محاولات على مدى ٨٠ ثانية"; exit 1; }
          echo "$body"
          python3 - "$body" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          bad = []
          if d.get('status') != 'active': bad.append(f"الحالة {d.get('status')}")
          # الخدمات التي بلا أيٍّ منها لا يعمل البوت فعلاً — وجودُ العملية وحده
          # ليس صحّة: بوتٌ حيّ بلا اتصال بالقاعدة يردّ على /health ولا يخدم أحداً.
          for k in ('telegram', 'supabase'):
              if d.get('services', {}).get(k) is not True: bad.append(f"خدمة {k} ساقطة")
          if not d.get('version'): bad.append('بلا رقم إصدار')
          if bad:
              print('::error::' + ' · '.join(bad)); sys.exit(1)
          print(f"✅ البوت {d['version']} · وضع {d.get('mode')} · منذ {d.get('uptime')}ث")
          PY

      # 🔴 حُذفت في v15.34 خطوةُ «١ب · ويبهوك تيليجرام بلا أخطاء»: اسمُها
      # يَعِد بفحص الويبهوك وهي في الحقيقة **نداءٌ ثانٍ لنفس `/health`** في
      # الخطوة ١ — صفرُ معلومةٍ جديدة وضِعفُ احتمال الإنذار الكاذب. وفحصُ
      # الويبهوك الحقيقيّ يحتاج توكنَ البوت (`getWebhookInfo`) وهو ليس هنا،
      # فالصوابُ إسقاطُها لا الإبقاء على وعدٍ لا تفي به.

      # ── ٢ و ٤ · الوظائف المجدولة · القرص والذاكرة وحجم القاعدة ──────────
      - name: ٢+٤ · نبض الخادم (وظائف · قرص · ذاكرة · حجم القاعدة)
        run: |
          set -uo pipefail
          key=$(curl -fsS --max-time 25 https://www.takisa.net/ \
                | grep -oE '[A-Za-z0-9_.-]+\.[a-f0-9]{8}\.js' | sort -u \
                | while read -r c; do
                    curl -fsS --max-time 25 -o /tmp/c.js "https://www.takisa.net/$c" || continue
                    k=$(grep -oE 'eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' /tmp/c.js | head -1)
                    [ -n "$k" ] && { printf '%s' "$k"; break; }
                  done)
          [ -n "$key" ] || { echo "::error::تعذّر استخراج المفتاح العلني من حزمة الموقع"; exit 1; }
          echo "$key" > /tmp/anon.key
          body=$(curl -fsS --max-time 30 -X POST \
                 -H "apikey: $key" -H "Authorization: Bearer $key" \
                 -H 'Content-Type: application/json' -d '{}' \
                 https://api.takisa.net/rest/v1/rpc/system_health_public) || body=""
          [ -n "$body" ] || { echo "::error::القاعدة لم تُجب على نداء النبض"; exit 1; }
          echo "$body"
          python3 - "$body" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          age = int(d.get('age_seconds') or 10**9)
          # النبض كل ١٠ دقائق. أكثر من ٤٥ دقيقة = الخادم لا يكتب — إمّا سقط،
          # وإمّا سقط الكرون، وإمّا امتلأ القرص فمنع الكتابة. الثلاثة تستحقّ إنذاراً.
          if age > 2700:
              print(f"::error::النبض قديم ({age//60} دقيقة) — الخادم قد يكون ساقطاً"); sys.exit(1)
          if d.get('status') != 'ok':
              print('::error::حالة الخادم «%s»: %s' % (d.get('status'), ' · '.join(d.get('issues') or []))); sys.exit(1)
          print(f"✅ الخادم سليم (نبضٌ عمره {age}ث)")
          PY

      # ── ٣ · قراءة صفّ حقيقي من القاعدة ───────────────────────────────────
      - name: ٣ · صفّ حقيقي يُقرأ فعلاً
        run: |
          set -uo pipefail
          key=$(cat /tmp/anon.key)
          # ٢٠٠ وحده لا يكفي: PostgREST يردّ ٢٠٠ ومصفوفةً **فارغة** حين تحجب RLS.
          # فالمطلوب صفٌّ فيه بيانات فعلاً — وهذا ما يُثبت أن القاعدة تخدم لا
          # أنها ترفع سمّاعة الهاتف.
          body=$(curl -fsS --max-time 30 \
                 -H "apikey: $key" -H "Authorization: Bearer $key" \
                 'https://api.takisa.net/rest/v1/regions?select=id,name&limit=1') || body=""
          echo "$body"
          python3 - "$body" <<'PY'
          import json, sys
          try: rows = json.loads(sys.argv[1])
          except Exception: print('::error::ردّ غير صالح من القاعدة'); sys.exit(1)
          if not isinstance(rows, list) or not rows:
              print('::error::القاعدة ردّت بلا صفوف — الجدول فارغ أو محجوب'); sys.exit(1)
          r = rows[0]
          if not r.get('id') or not r.get('name'):
              print('::error::الصفّ ناقص الحقول: %r' % r); sys.exit(1)
          print(f"✅ قُرئ صفٌّ حقيقي: {r['id']} — {r['name']}")
          PY

      # ── تنبيهٌ يصل جوّالاً، من خارج كلِّ ما نراقبه ─────────────────────────
      # نسخةٌ مطابقةٌ لخطوةِ «مراقبة توقّف تاكي»، عن قصد: السيرانِ يُجدوَلان
      # مستقلّين (١٩/١٠٠ فقط من تشغيلاتهما متقاربة)، ودمجُ زمنيهما يُنزِل
      # وسيطَ فجوةِ الرصد الخارجيّ من ٢٨٦–٢٩١ إلى **١٠٣٫٤ دقيقة**. فلو حمل
      # أحدُهما وحدَه التنبيهَ لضاع نصفُ ذلك النفع. (ولا عاملٌ مركَّبٌ مشتركٌ
      # تحت `.github/actions/` — ملفّان اثنان لا يستحقّان بنيةً ثالثة.)
      # 🪤 ولا سرَّ في الملفّ، والفحصُ داخل الصدفة لا في `if:` (سياقُ `secrets`
      #    غيرُ متاحٍ هناك فيُقيَّم فارغاً دائماً). والخطوةُ لا تُفشل شيئاً.
      # 🪤 ولا تُتَّهم فترةٌ كان الخادمُ فيها مطفأً — والكتمُ يعمل فعلاً، قِيس:
      #    فشلُ هذا السير كان ٣٣ تشغيلاً من المئة، **كلُّها بين ٢٠ و٢٥ أكتوبر**
      #    (١٢ منها فُحصت فكان سببُها الوظائفَ الأسبوعية التي لم يكن بإمكانها
      #    العمل: الخادمُ كان مطفأً ٢–١٩ أكتوبر)، و**آخرُ ٦٧ تشغيلاً ناجحةٌ
      #    كلُّها** بعد أن صار `taki_cron_health` يقيس التوقّفَ من `alive_since`.
      - name: تنبيهُ الفشل — بريدٌ مباشر (يتخطّى بصمتٍ إن لم يوجد سرّ)
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
        run: |
          set -uo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ALERT_EMAIL:-}" ]; then
            echo "::warning::لا سرَّ بريدٍ في المستودع (RESEND_API_KEY / ALERT_EMAIL) — التنبيهُ الوحيد هو بريدُ GitHub التلقائي"
            exit 0
          fi
          python3 - <<'PY' > /tmp/alert.json
          import json, os
          wf = os.environ.get('WF', 'TAKI checks')
          url = os.environ.get('RUN_URL', '')
          print(json.dumps({
              'from': 'TAKI <no-reply@takisa.net>',
              'to': [os.environ['ALERT_EMAIL']],
              'subject': f'🚨 مراقبةٌ خارجية فشلت: {wf} · external monitor failed',
              'html': (
                  '<div dir="rtl" style="font:16px/1.7 -apple-system,system-ui,sans-serif">'
                  f'<p>فشل السيرُ <b>{wf}</b> على خوادم GitHub — أي أنّ البوتَ أو نبضَ '
                  'الخادم أو قراءةَ صفٍّ حقيقيّ لم تُجب <b>من خارج الخادم</b>.</p>'
                  f'<p><a href="{url}">افتح السجلَّ لمعرفة الخطوة التي سقطت</a></p></div>'
                  '<hr><div dir="ltr" style="font:14px/1.6 -apple-system,system-ui,sans-serif">'
                  f'External checks <b>{wf}</b> failed on GitHub runners — the bot, the server '
                  f'heartbeat, or a real row read did not answer from outside the box. '
                  f'<a href="{url}">Open the run log</a>.'
                  '</div>'),
          }, ensure_ascii=False))
          PY
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' --max-time 25 -X POST \
                 -H "Authorization: Bearer $RESEND_API_KEY" \
                 -H 'Content-Type: application/json' \
                 --data-binary @/tmp/alert.json \
                 https://api.resend.com/emails) || code=000
          echo "Resend: $code"
          [ "$code" = "200" ] || echo "::warning::تعذّر إرسالُ بريد التنبيه ($code) — يبقى بريدُ GitHub التلقائي"
