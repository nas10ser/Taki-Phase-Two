name: بناء تطبيق أندرويد

# ═══════════════════════════════════════════════════════════════════════════
# 🔴 لماذا يُبنى هنا لا على ماك ناصر: ماكُه على macOS 12 وجافا 10، و
#    Android Gradle Plugin الحديث يحتاج JDK 21. والبناءُ هنا مجّانيّ
#    (المستودعُ عامّ) ونظيفٌ في كلّ مرّة.
#
# 🪤 ويعمل **بلا أيّ سرّ**: بلا مفتاح توقيعٍ يُنتج حزمةَ تصحيحٍ (`debug`)
#    قابلةً للتثبيت والتجربة — فنثبت أن المشروع يُبنى **قبل** أن يدفع ناصر
#    خمسةً وعشرين دولاراً. وبوجود السرّ يُنتج `.aab` موقَّعاً جاهزاً للرفع.
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'حزمةُ إصدارٍ موقَّعة (تحتاج أسرارَ التوقيع)'
        type: boolean
        default: false
  push:
    tags: ['app-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # JDK 21: ما يطلبه AGP الحديث. و`temurin` توزيعةٌ مستقرّةٌ ومجّانية.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: تثبيتُ الاعتماديّات
        run: npm ci

      - name: بناءُ الواجهة
        env:
          TAKI_NATIVE_BUILD: '1'
          # 🪤 والقيمُ من `scripts/native-env.js` — عامّةٌ بطبيعتها، انظر شرحَه.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node scripts/native-env.js
          npm run build

      - name: مزامنةُ Capacitor وترقيعُ سياسة التطبيق
        run: node scripts/native-sync.js

      # ── Firebase: ملفُّ الإعداد من سرٍّ، لا من المستودع ──────────────────
      # 🔴 والمستودعُ **عامّ**: `google-services.json` يحمل معرّفَ مشروعِ
      #    Firebase ومفتاحَ واجهته، فلا يدخل المستودعَ أبداً — ولذلك أُعيد
      #    تفعيلُ سطرِه في `android/.gitignore` (كان **مُعلَّقاً**، أي أن
      #    الملفَّ لم يكن مُستثنى فلو وُضع محلياً لحظةً لبقي في التاريخ أبداً).
      # 🪤 وغيابُه حالةٌ مشروعةٌ اليوم: الكتلةُ في `app/build.gradle` شرطيّة،
      #    فالبناءُ ينجح بلا الملفّ — ولا إشعاراتَ FCM وحدها هي التي تتوقّف.
      - name: ملفُّ إعداد Firebase (إن وُجد سرُّه)
        id: gservices
        env:
          GS: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${GS:-}" ]; then
            echo "ℹ️ لا سرَّ ANDROID_GOOGLE_SERVICES_JSON_B64 — يُبنى بلا FCM (الكتلةُ شرطيّة)."
            echo "present=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s' "$GS" | base64 -d > android/app/google-services.json
          # 🪤 ويُفحص أنه JSON سليمٌ وأن اسمَ الحزمة هو حزمتُنا: ملفٌّ لمشروعٍ
          #    آخر يُطبَّق بنجاح ثمّ لا يصل رمزُ جهازٍ أبداً، بلا أيّ خطأ.
          node -e "
            const j=require('./android/app/google-services.json');
            const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==='net.takisa.app');
            if(!ok){console.error('::error title=أندرويد::google-services.json لا يحمل net.takisa.app');process.exit(1)}
            console.log('✓ google-services.json لمشروع '+j.project_info.project_id+' · الحزمةُ مطابقة');
          "
          echo "present=true" >> "$GITHUB_OUTPUT"

      # ── التوقيع: لا يُفعَّل إلا بوجود السرّ، ولا يُكتب مفتاحٌ في المستودع ──
      # 🪤 ووجودُ السرّ يُفحص في **خطوةٍ** لا في شرط `if` مباشرةً: سياقُ
      #    `secrets` غيرُ مضمون داخل شروط الخطوات، فشرطٌ يبدو صحيحاً قد
      #    يُقيَّم دائماً خطأً — فيُبنى debug صامتاً حيث يُراد release.
      # 🪤 وتُفحص **الأربعةُ** لا المفتاحُ وحده: بالقديم كان يكفي
      #    `ANDROID_KEYSTORE_BASE64` فتبدأ حزمةُ الإصدار ثمّ يفشل gradle على
      #    كلمةِ مرورٍ فارغةٍ بخطأٍ عن «keystore password was incorrect» —
      #    رسالةٌ تُوهم أن المفتاحَ خاطئ وهو سليمٌ وسرٌّ آخرُ هو الناقص.
      - name: هل التوقيعُ متاح؟
        id: sign
        env:
          KS:       ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW:    ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 🔴 ولا تُطبع قيمةُ سرٍّ أبداً — الأسماءُ الناقصةُ وحدها.
          miss=""
          for n in KS KS_PW KEY_ALIAS KEY_PW; do
            eval "v=\${$n:-}"
            [ -n "$v" ] || miss="$miss $n"
          done
          if [ -z "$miss" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          echo "missing=${miss# }" >> "$GITHUB_OUTPUT"
          echo "الناقصُ من أسرار التوقيع:${miss:- (لا شيء)}"

      - name: فكُّ مفتاح التوقيع
        id: keystore
        if: steps.sign.outputs.ok == 'true' && (inputs.release || github.event_name == 'push')
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/taki.keystore"
          test -s "$RUNNER_TEMP/taki.keystore" || { echo "❌ مفتاحُ التوقيع فارغ"; exit 1; }
          echo "✓ مفتاحُ التوقيع ($(wc -c < "$RUNNER_TEMP/taki.keystore") بايت)"

      - name: حزمةُ إصدارٍ موقَّعة (.aab)
        id: bundle
        if: steps.keystore.outcome == 'success'
        working-directory: android
        env:
          TAKI_KEYSTORE_PATH: ${{ runner.temp }}/taki.keystore
          TAKI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAKI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAKI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: حزمةُ تجربةٍ (بلا توقيع)
        id: debug_apk
        if: steps.sign.outputs.ok != 'true' || !(inputs.release || github.event_name == 'push')
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # ── عقودٌ تُفحص في الناتج لا في النيّة ──────────────────────────────
      - name: التحقّقُ من الحزمة
        run: |
          set -euo pipefail
          AAB=$(find android -name '*.aab'  -newermt '-2 hours' | head -1 || true)
          APK=$(find android -name '*.apk'  -newermt '-2 hours' | head -1 || true)
          OUT="${AAB:-$APK}"
          test -n "$OUT" || { echo "❌ لم تُنتج أيُّ حزمة"; exit 1; }
          echo "✓ الحزمة: $OUT ($(du -h "$OUT" | cut -f1))"

          # الحزمةُ أرشيفُ zip — تُفحص محتوياتُها لا حجمُها وحده.
          unzip -l "$OUT" > /tmp/list.txt
          for need in "AndroidManifest.xml" "assets/public/index.html" "res/mipmap"; do
            grep -q "$need" /tmp/list.txt || { echo "❌ ناقصٌ من الحزمة: $need"; exit 1; }
          done
          echo "✓ الواجهةُ والأيقوناتُ والبيانُ داخل الحزمة"

          # 🪤 وحزمةُ الواجهة نفسُها: `index.html` وحده قد يكون قشرةً فارغة.
          grep -qE "assets/public/.*\.js" /tmp/list.txt || { echo "❌ لا حزمةَ جافاسكربت"; exit 1; }
          echo "✓ حزمةُ جافاسكربت موجودة"

      - name: أثرُ الإصدار (.aab)
        uses: actions/upload-artifact@v4
        if: steps.bundle.outcome == 'success'
        with:
          name: taki-android-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # 🪤 وأثرُ التجربة باسمٍ **مختلف**: الاسمُ الواحد لحزمتَي إصدارٍ وتجربةٍ
      #    هو ما جعل `taki-android` (٣١٫٧ م.ب) يُقرأ على أنه نشرةٌ جاهزة وهو
      #    حزمةُ تصحيحٍ موقَّعةٌ بمفتاح debug — ترفضها قوقل رفضاً فورياً.
      - name: أثرُ حزمة التجربة (.apk)
        uses: actions/upload-artifact@v4
        if: steps.debug_apk.outcome == 'success'
        with:
          name: taki-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # ═══════════════════════════════════════════════════════════════════════
      # 🔴 عقدُ الإصدار — نفسُ عقد آيفون حرفياً، وبنفس السبب المقيس: دفعُ وسم
      #    `app-v15.58.4` انتهى أخضرَ وقد خُطّيت حزمةُ الإصدار ورُفعت حزمةُ
      #    تصحيح. و«أخضر» لا يجوز أن يعني ذلك مرّةً أخرى.
      # 🪤 ولا خطوةَ رفعٍ إلى Google Play هنا **عمداً**: أوّلُ `.aab` يجب أن
      #    يُرفع من لوحة Play بيد ناصر (واجهةُ Play لا تُنشئ تطبيقاً، ولا
      #    تَقبل مساراً لا يحمل نشرةً أولى)، ولا مفتاحَ توقيعٍ بعد. فحين
      #    يوجد الاثنان تُضاف الخطوةُ وتُضاف `upload_play` إلى هذه القائمة.
      # ═══════════════════════════════════════════════════════════════════════
      - name: عقدُ الإصدار — أخضرُ لا يعني قابلاً للرفع
        if: always()
        env:
          PLATFORM:     أندرويد
          INTENT_INPUT: ${{ inputs.release }}
          EVENT:        ${{ github.event_name }}
          SIGN_OK:      ${{ steps.sign.outputs.ok }}
          SIGN_MISSING: ${{ steps.sign.outputs.missing }}
          CONTRACT_STEPS: >-
            keystore=${{ steps.keystore.outcome }}
            bundle=${{ steps.bundle.outcome }}
          CONTRACT_ARTIFACT: android/app/build/outputs/bundle/release
          CONTRACT_ARTIFACT_GLOB: '*.aab'
        run: bash .github/release-contract.sh
