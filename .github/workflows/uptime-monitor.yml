# مراقبة توقّف تاكي — تعمل على خوادم GitHub، مستقلّة تماماً عن خادم جدة
# وعن Vercel وعن Render، فلو سقط أيٌّ منها بقيت المراقبة تعمل وتُنبّه.
#
# 🔴 وهذه **الساقُ الوحيدةُ** التي تستطيع الإبلاغَ عن موتِ خادم جدة. كلُّ
# الكشفِ السريع يجري **داخلَ** الصندوق (كرونُ النبض كلَّ عشر دقائق · pg_cron
# كلَّ ربعِ ساعة) وبريدُ تنبيهه يخرج من القاعدة نفسها إلى `api.resend.com`
# (`taki_alert_dispatch`) — ومنبّهٌ يموت مع الصندوق ليس منبّهاً. ⇒ لا تُحذف
# هذه المراقبةُ ولا يُستعاض عنها بما يعمل على الخادم.
#
# ═══ التنبيه: قناتان، وكلتاهما خارج كلِّ ما نراقبه ═══
#   ١) بريدُ GitHub التلقائي لمالك المستودع عند فشل المهمّة (قائمٌ منذ أغسطس).
#   ٢) وبريدٌ مباشرٌ من داخل السير عبر Resend — الخطوةُ الأخيرة. يعمل **فقط**
#      إن وُجد سرّا المستودع `RESEND_API_KEY` و`ALERT_EMAIL`، وإلّا تخطّى
#      بتحذيرٍ ولم يُفشل شيئاً. ولا عنوانَ بريدٍ في هذا الملفّ: المستودعُ عام.
#
# 🔴 ولا ادّعاءَ لمراقبٍ خارجيّ لا نملك دليلَه: كان هنا سطرٌ يقول «طبقةٌ ثانية
# بجانب UptimeRobot — لا بديلاً عنها»، وفحصٌ شاملٌ على `*.yml *.md *.js *.sh
# *.json` لم يجد له إعداداً ولا سرّاً ولا سكربتاً ولا أيَّ `UPTIME_*` في
# أسرار المستودع. فحُذف. وضررُه أنه كان يُظهر هذه الطبقةَ البطيئة احتياطاً
# وهي **الوحيدة**، فيُهوَّن أمرُ بطئها. (وثيقةٌ تَعِد بما لا يُنفَّذ أسوأُ من
# وثيقةٍ لا تَعِد — درسُ v14.82.)
#
# ⚠️ الجدولة تعمل من الفرع الافتراضي (main) فقط — هذا شرط GitHub Actions.
#
# 🔴 **والرقمُ في `cron` أدناه ليس وعداً، وقِيس من تاريخِ التشغيل لا من التعبير.**
# ٨ نوفمبر ٢٠٢٦، آخرُ ١٠٠ تشغيلٍ مجدوَلٍ لهذا السير (عبر واجهة GitHub):
#   المدى ٢٠ أكتوبر ← ٨ نوفمبر · ٩٩ فجوة · أصغرُها ١١٩٫٨ دقيقة ·
#   **الوسيطُ ٢٨٦٫٠** · ٧٥٪ ٣٦٢٫٥ · ٩٠٪ ٤١٤٫٤ · أكبرُها ٦٠٦٫٢ (عشرُ ساعات) ·
#   و**٩٩/٩٩ فجوةً تتجاوز الساعة** — أي أنّ «كلَّ عشر دقائق» لم تتحقّق ولا مرّة.
#   (وCLAUDE.md سجّلت ٢٠٥ دقيقةً وسيطاً سابقاً ⇒ الحالُ تردّى ٤٠٪، لا تحسّن.)
# ⇒ لا يُبنى كشفٌ سريعٌ على هذه الجدولة، ولا تُصلح: خنقُها سياسةُ GitHub
#   للحسابات المجانية. تُستعمل لِما لا يراه أحدٌ غيرُها، وبطؤها مقبولٌ لأنه
#   مُعلَن. 🪤 ومعدَّلُ التشغيل الفعليّ ≈٥ مرّاتٍ يومياً **مهما كان التعبير**
#   (هذا السير يعلن ٦/ساعة و«الفحوص الأربعة» تعلن ٤/ساعة، وكلاهما ينفّذ ٥
#   يومياً) — فإضافةُ سطورِ `cron` لا تزيد شيئاً.
# 🟢 لكنّ **سيرَين بجدولتين منفصلتين يتضاعف نفعُهما**: ١٩/١٠٠ فقط من تشغيلات
#   هذا السير تقع داخل عشرِ دقائقَ من تشغيلٍ لـ«الفحوص الأربعة»، فالعيّنتان
#   مستقلّتان عملياً. ودمجُ زمنَي السيرين يُنزِل وسيطَ فجوةِ **الرصد الخارجيّ**
#   من ٢٨٦ إلى **١٠٣٫٤ دقيقة** (٩٠٪ ٣٤٤٫٩ · أكبرُها ٥٩١٫٩). وكلاهما يلمس خادمَ
#   جدة ⇒ كلاهما يرى موتَه. ولذلك يحمل **الاثنان** خطوةَ التنبيه نفسَها.
name: مراقبة توقّف تاكي

on:
  schedule:
    - cron: '*/10 * * * *'   # كل ١٠ دقائق
  workflow_dispatch:          # وزر تشغيل يدوي

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: الموقع (Vercel)
        run: |
          # ملاحظة: `code=$(curl …) || code=000` وليس `|| echo 000` —
          # الثانية تُلحق الرمزين معاً (200 + 000 = "200000") فتُنتج إنذاراً
          # كاذباً عند مهلة متأخّرة. اختُبر الفرق فعلياً.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                 https://www.takisa.net) || code=000
          [ -n "$code" ] || code=000
          echo "الرمز: $code"
          [ "$code" = "200" ] || { echo "::error::الموقع لا يستجيب ($code)"; exit 1; }

      - name: قاعدة جدة (api.takisa.net) — PostgREST
        run: |
          # 401 استجابة صحيحة: الخدمة حيّة وترفض الطلب بلا مفتاح.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                 https://api.takisa.net/rest/v1/) || code=000
          [ -n "$code" ] || code=000
          echo "الرمز: $code"
          case "$code" in
            200|401|404) echo "✅ القاعدة ترد" ;;
            *) echo "::error::قاعدة جدة لا تستجيب ($code)"; exit 1 ;;
          esac

      - name: قاعدة جدة — خدمة الحسابات (GoTrue)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                 https://api.takisa.net/auth/v1/health) || code=000
          [ -n "$code" ] || code=000
          echo "الرمز: $code"
          case "$code" in
            200|401) echo "✅ خدمة الحسابات ترد" ;;
            *) echo "::error::خدمة الحسابات لا تستجيب ($code)"; exit 1 ;;
          esac

      - name: شهادة HTTPS — تنبيه قبل انتهائها
        run: |
          end=$(echo | openssl s_client -servername api.takisa.net \
                -connect api.takisa.net:443 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2) || end=""
          if [ -z "$end" ]; then
            echo "::error::تعذّر قراءة الشهادة — الخادم قد يكون ساقطاً"; exit 1
          fi
          echo "تنتهي: $end"
          left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "المتبقّي: $left يوماً"
          [ "$left" -gt 10 ] || { echo "::error::الشهادة تنتهي خلال $left يوماً"; exit 1; }

      # ── تنبيهٌ يصل جوّالاً، من خارج كلِّ ما نراقبه ─────────────────────────
      # 🔴 بريدُ GitHub التلقائي قائمٌ ويعمل، لكنّه بريدُ «إشعارات مستودع»
      # يسهل ترشيحُه ولا يحمل سببَ الفشل في عنوانه. وهذا سطرٌ ثانٍ بعنوانٍ
      # يقول ما سقط، ورابطٍ واحدٍ يفتح السجلّ.
      # 🪤 ولا سرَّ في الملفّ: المستودعُ عام، وأسرارُ المستودع ليست كذلك.
      #    والمفتاحُ هو **نفسُه** مفتاحَ Resend العاملَ على الخادم — فلا حسابَ
      #    جديد ولا سرَّ جديد، نسخةٌ من سرٍّ قائم في موضعٍ ثانٍ مستقلّ.
      # 🪤 والفحصُ داخل الصدفة لا في `if:`: سياقُ `secrets` غيرُ متاحٍ في `if:`
      #    على مستوى الخطوة، فشرطٌ هناك يُقيَّم فارغاً **دائماً** فلا يعمل.
      # 🪤 وهذه الخطوةُ لا تُفشل شيئاً ولا تُنجّي شيئاً: المهمّةُ فاشلةٌ أصلاً
      #    (`if: failure()`)، وفشلُ البريد يُقال تحذيراً لا خطأً — وإلّا صار
      #    غيابُ سرٍّ اختياريٍّ سبباً لصرخةٍ ثانية.
      # 🪤 وبلا كتمِ تكرار: GitHub لا يمنح الأسرارَ ذاكرةً بين التشغيلات،
      #    والمعدَّلُ المقيس ≈٥ تشغيلاتٍ يومياً — فانقطاعٌ كاملٌ يُنتج ≈٥ رسائل
      #    في اليوم، وكلُّها **قابلةٌ للتصرّف**. والكتمُ الحقيقيّ موضعُه القاعدة
      #    (`taki_alert_dispatch`: تهدئةُ المنادي + أرضيّةُ بصمة).
      - name: تنبيهُ الفشل — بريدٌ مباشر (يتخطّى بصمتٍ إن لم يوجد سرّ)
        if: failure()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF: ${{ github.workflow }}
        run: |
          set -uo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ALERT_EMAIL:-}" ]; then
            echo "::warning::لا سرَّ بريدٍ في المستودع (RESEND_API_KEY / ALERT_EMAIL) — التنبيهُ الوحيد هو بريدُ GitHub التلقائي"
            exit 0
          fi
          # الجسمُ يُبنى بـpython لا بـecho: النصُّ عربيٌّ وأيُّ هروبٍ يدويّ
          # داخل JSON يُنتج طلباً يفشل بـ٤٠٠ ويبدو «لم يُرسل» بلا سبب.
          python3 - <<'PY' > /tmp/alert.json
          import json, os
          wf = os.environ.get('WF', 'TAKI monitor')
          url = os.environ.get('RUN_URL', '')
          print(json.dumps({
              'from': 'TAKI <no-reply@takisa.net>',
              'to': [os.environ['ALERT_EMAIL']],
              'subject': f'🚨 مراقبةٌ خارجية فشلت: {wf} · external monitor failed',
              'html': (
                  '<div dir="rtl" style="font:16px/1.7 -apple-system,system-ui,sans-serif">'
                  f'<p>فشل السيرُ <b>{wf}</b> على خوادم GitHub — أي أنّ شيئاً من '
                  'الموقع أو قاعدة جدة لم يُجب <b>من خارج الخادم</b>.</p>'
                  f'<p><a href="{url}">افتح السجلَّ لمعرفة الخطوة التي سقطت</a></p></div>'
                  '<hr><div dir="ltr" style="font:14px/1.6 -apple-system,system-ui,sans-serif">'
                  f'External monitor <b>{wf}</b> failed on GitHub runners — the site or the '
                  f'Jeddah database did not answer from outside the box. <a href="{url}">Open the run log</a>.'
                  '</div>'),
          }, ensure_ascii=False))
          PY
          # 🪤 والنتيجةُ تُقرأ بـ`code=$(curl …) || code=000` لا بـ`|| echo 000`
          #    (الثانية تُلحق الرمزين فتصير "200000" — نفسُ درسِ الخطوة الأولى).
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' --max-time 25 -X POST \
                 -H "Authorization: Bearer $RESEND_API_KEY" \
                 -H 'Content-Type: application/json' \
                 --data-binary @/tmp/alert.json \
                 https://api.resend.com/emails) || code=000
          echo "Resend: $code"
          [ "$code" = "200" ] || echo "::warning::تعذّر إرسالُ بريد التنبيه ($code) — يبقى بريدُ GitHub التلقائي"
