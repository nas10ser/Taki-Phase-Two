<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0f172a;font-family:-apple-system,"SF Arabic","Helvetica Neue",Arial,sans-serif;
       display:flex;align-items:center;gap:40px;padding:0 64px;position:relative}
  .glow{position:absolute;border-radius:50%;filter:blur(2px);opacity:.14}
  .g1{width:460px;height:460px;background:#10b981;top:-170px;left:-120px}
  .g2{width:380px;height:380px;background:#10b981;bottom:-190px;right:-110px}
  .logo{width:400px;height:400px;object-fit:contain;flex:none;z-index:1;
        filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
  .txt{z-index:1;flex:1;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
  .pill{background:#10b981;color:#06281d;font-weight:900;font-size:25px;
        padding:9px 24px;border-radius:999px;letter-spacing:.3px}
  h1{font-size:118px;font-weight:900;color:#fff;line-height:.95;letter-spacing:-2px}
  .sub{font-size:31px;font-weight:700;color:#cbd5e1;line-height:1.5}
  .dom{font-size:26px;font-weight:800;color:#10b981;letter-spacing:.4px;direction:ltr}
</style></head><body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <img class="logo" src="../../branding/taki-logo-master.png" alt="">
  <div class="txt">
    <span class="pill">تخفيضات · السعودية</span>
    <h1>TAKI</h1>
    <div class="sub">احجز التخفيض الآن · وادفع في المتجر</div>
    <div class="dom">www.takisa.net</div>
  </div>
</body></html>
