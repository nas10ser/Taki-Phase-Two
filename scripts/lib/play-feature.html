<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  body{background:#0f172a;font-family:-apple-system,"SF Arabic","Helvetica Neue",Arial,sans-serif;
       display:flex;align-items:center;gap:34px;padding:0 56px;position:relative}
  .glow{position:absolute;border-radius:50%;filter:blur(2px);opacity:.14}
  .g1{width:380px;height:380px;background:#10b981;top:-150px;left:-100px}
  .g2{width:320px;height:320px;background:#10b981;bottom:-160px;right:-90px}
  .logo{width:300px;height:300px;object-fit:contain;flex:none;z-index:1;
        filter:drop-shadow(0 14px 32px rgba(0,0,0,.45))}
  .txt{z-index:1;flex:1;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .pill{background:#10b981;color:#06281d;font-weight:900;font-size:21px;
        padding:7px 20px;border-radius:999px}
  h1{font-size:86px;font-weight:900;color:#fff;line-height:.95}
  .sub{font-size:26px;font-weight:700;color:#cbd5e1;line-height:1.45}
  .dom{font-size:21px;font-weight:800;color:#10b981;direction:ltr}
</style></head><body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <img class="logo" src="../../branding/taki-logo-master.png" alt="">
  <div class="txt">
    <span class="pill">تخفيضات · السعودية</span>
    <h1>تاكي</h1>
    <div class="sub">احجز التخفيض الآن · وادفع في المتجر</div>
    <div class="dom">www.takisa.net</div>
  </div>
</body></html>
