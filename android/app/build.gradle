apply plugin: 'com.android.application'

// ══════════════════════════════════════════════════════════════════════════
// رقمُ نسخةِ التطبيق — **يُقرأ من المصدر الحيّ، ولا يُكتب رقمٌ في هذا الملفّ**
// ──────────────────────────────────────────────────────────────────────────
// 🔴 العيبُ المقيس: كان هنا `versionCode 155800` و`versionName "15.58.0"`
//    مكتوبين بيدٍ **تحت تعليقٍ يَعِد بسكربتٍ لا وجودَ له**، فتجمّدا عشرين
//    إصداراً (المنصّةُ على 15.80). والقاعدةُ المذكورةُ كانت صحيحةً تماماً —
//    لكنها كُتبت ولم تُنفَّذ، وهذا أسوأُ من ألّا تُكتب.
// 🔴 و`versionCode` عند قوقل **لا يجوز أن ينقص أبداً**، ورقمٌ خاطئٌ في أوّل
//    رفعةٍ يحرق المدى كلَّه بلا رجعة. فلا يُخمَّن ولا يُنسخ.
// 🪤 والمصدرُ `CACHE_NAME` في `sw.js` لأنه **مرفوعٌ مع كلّ نشرٍ بحكم قاعدةٍ
//    يحرسها `check-cache-bump.js`** — أي أنه الرقمُ الحيُّ فعلاً؛ و
//    `package.json` يُطابقه بحكم `check-versions.js`. فالسلسلةُ مغلقة.
//    ولذلك يُشترط تطابقُ «كبير.صغير» بينهما هنا أيضاً: لو انفكّ الحرّاسُ
//    يوماً، لا تُبنى حزمةُ متجرٍ برقمٍ مجهولِ النسب.
// 🪤 وكلُّ جزءٍ ≤ ٩٩: الصيغةُ تحشو خانتين، و١٠٠ تُزحزح الخانات فينقص الرقمُ
//    عمّا سبقه — وذاك عطبٌ لا يُصلَح عند قوقل.
// ══════════════════════════════════════════════════════════════════════════
// taki-version:begin
def takiRepoRoot = rootDir.parentFile
def takiSw = new File(takiRepoRoot, 'sw.js').getText('UTF-8')
def takiSwM = (takiSw =~ /CACHE_NAME\s*=\s*['"]taki-cache-v(\d+)\.(\d+)['"]/)
if (!takiSwM.find()) {
    throw new RuntimeException('❌ تعذّر قراءة CACHE_NAME من sw.js — ولا يُبنى تطبيقٌ برقمٍ مخترع.')
}
def takiPkg = new File(takiRepoRoot, 'package.json').getText('UTF-8')
def takiPkgM = (takiPkg =~ /"version"\s*:\s*"(\d+)\.(\d+)\.(\d+)"/)
if (!takiPkgM.find()) {
    throw new RuntimeException('❌ تعذّر قراءة version من package.json بصيغة X.Y.Z.')
}
if (takiPkgM.group(1) != takiSwM.group(1) || takiPkgM.group(2) != takiSwM.group(2)) {
    throw new RuntimeException(
        '❌ package.json ' + takiPkgM.group(0) + ' لا يطابق CACHE_NAME (' +
        takiSwM.group(1) + '.' + takiSwM.group(2) + ') — يُصلَح المصدرُ لا هذا الملفّ.')
}
def takiParts = [takiPkgM.group(1), takiPkgM.group(2), takiPkgM.group(3)].collect { it as int }
takiParts.each {
    if (it > 99) {
        throw new RuntimeException(
            '❌ جزءٌ من الإصدار «' + it + '» أكبرُ من ٩٩ — صيغةُ versionCode تحشو خانتين،' +
            ' فالرقمُ سينقص عمّا سبقه. و`versionCode` لا يجوز أن ينقص عند قوقل.')
    }
}
ext.takiVersionName = takiParts.join('.')
ext.takiVersionCode = takiParts.collect { String.format('%02d', it) }.join('') as int
println '→ نسخةُ تطبيق أندرويد: ' + ext.takiVersionName + ' (' + ext.takiVersionCode + ')'
// taki-version:end

android {
    // ══════════════════════════════════════════════════════════════════════
    // التوقيع: القيمُ من البيئة وحدها (أسرارُ GitHub Actions).
    // 🔴 والمستودعُ **عامّ** فلا يدخله مفتاحٌ ولا كلمةُ مرورٍ أبداً. وبلا
    //    متغيّرات البيئة يبني `debug` فقط — ولا يفشل البناءُ المحلّيّ صامتاً.
    // ══════════════════════════════════════════════════════════════════════
    signingConfigs {
        release {
            if (System.getenv("TAKI_KEYSTORE_PATH")) {
                storeFile     file(System.getenv("TAKI_KEYSTORE_PATH"))
                storePassword System.getenv("TAKI_KEYSTORE_PASSWORD")
                keyAlias      System.getenv("TAKI_KEY_ALIAS")
                keyPassword   System.getenv("TAKI_KEY_PASSWORD")
            }
        }
    }

    namespace = "net.takisa.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.takisa.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // الإصدارُ مُشتقٌّ أعلى هذا الملفّ من `sw.js` و`package.json`.
        // 🔴 ولا يُكتب رقمٌ هنا بحالٍ — وجودُ رقمٍ حرفيٍّ في هذين السطرين
        //    يُفشله `scripts/check-release-contract.js` عمداً.
        versionCode project.ext.takiVersionCode
        versionName project.ext.takiVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (System.getenv("TAKI_KEYSTORE_PATH")) { signingConfig signingConfigs.release }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google Play Billing — اشتراكُ التاجر داخل التطبيق (v15.67).
    // 🪤 وإصدارٌ مثبَّتٌ لا نطاق: Billing غيّر واجهته جذرياً بين ٥ و٦ و٧
    //    (`queryProductDetailsAsync` و`PendingPurchasesParams` و`offerToken`)،
    //    فنطاقٌ مفتوح يكسر البناءَ في نشرةٍ لا نعرف متى.
    implementation 'com.android.billingclient:billing:7.1.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
