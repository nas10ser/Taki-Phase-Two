        <li><strong>احجز</strong> بضغطة واحدة، فيصلك باركود الحجز فوراً.</li>
        <li><strong>استلم وادفع</strong> عند التاجر خلال مدة الحجز.</li>

      <h2>TAKI — Deal booking platform in Saudi Arabia</h2>
      <p><strong>TAKI is a Saudi platform for booking discounts and offers from local
         merchants.</strong> You book a deal in the app, then collect it from the
         merchant and pay on the spot — no shipping, and no fees for the buyer.</p>

      <h3>How it works</h3>
      <ol>
        <li>Pick a deal from the list or from the nearby-offers map.</li>
        <li>Book it in one tap and get a booking barcode.</li>
        <li>Collect and pay at the merchant within the booking window.</li>
      </ol>

      <h3>Why TAKI is different from online stores</h3>
      <ul>
        <li>Completely free for buyers — no fees, no subscription, no commission.</li>
        <li>No money held on your card: you pay the merchant on collection.</li>
        <li>You inspect the goods before paying.</li>
        <li>No shipping wait — offers come from merchants in your city.</li>
        <li>Covers every region of Saudi Arabia, most active in Riyadh, Jeddah and Dammam.</li>
      </ul>

      <p>Categories: mall and market offers, restaurant and cafe deals, end-of-season
         sales, White Friday offers, local store discounts, service deals.</p>
