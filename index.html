      <h1>TAKI (تاكي) — منصة حجز التخفيضات في السعودية</h1>
      <p><strong>تاكي منصة سعودية لحجز التخفيضات والعروض من التجار المحليين.</strong>
         تحجز العرض من التطبيق، ثم تستلمه من التاجر مباشرة وتدفع عنده، أو تطلب توصيله برسوم يحددها التاجر —
         والتصفح والحجز مجانيان.</p>

      <h2>كيف تعمل تاكي في ثلاث خطوات</h2>
      <ol>
        <li><strong>اختر عرضاً</strong> من قائمة العروض أو من خريطة العروض القريبة منك.</li>
        <li><strong>احجز</strong> بضغطة واحدة، فيصلك باركود الحجز فوراً.</li>
        <li><strong>استلم وادفع</strong> عند التاجر خلال مدة الحجز.</li>
      </ol>

      <h2>ما الذي يميز تاكي عن المتاجر الإلكترونية</h2>
      <ul>
        <li>التصفح والحجز مجانيان — لا اشتراك ولا عمولة. ورسوم التوصيل إن اخترته يحددها التاجر.</li>
        <li>الأصل أن تدفع للتاجر عند الاستلام. وإن اخترت الدفع الإلكتروني فالمبلغ يذهب لحساب التاجر مباشرة.</li>
        <li>تتفقد البضاعة بنفسك قبل الدفع.</li>
        <li>لا انتظار شحن — العروض من تجار في مدينتك.</li>
        <li>تغطي كل مناطق المملكة، والنشاط الأكبر في الرياض وجدة والدمام.</li>
      </ul>

      <h2>أنواع العروض المتاحة</h2>
      <p>عروض المولات والأسواق · عروض المطاعم والمقاهي · تخفيضات نهاية الموسم ·
         عروض الجمعة البيضاء · خصومات المتاجر المحلية · عروض الخدمات.</p>

      <h2>للتجار</h2>
      <p>ينشر التاجر عروضه بنفسه ويحدد الكميات والمواقع ومدة الحجز، ويستقبل الحجوزات
         عبر لوحة تحكم أو عبر بوت تيليجرام. تاكي وسيط تقني للعرض والربط فقط، وليست
         طرفاً في أي عقد بيع.</p>

    <main lang="en" dir="ltr" style="max-width:60ch;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.8;">
      <h2>TAKI — Deal booking platform in Saudi Arabia</h2>
      <p><strong>TAKI is a Saudi platform for booking discounts and offers from local
         merchants.</strong> You book a deal in the app, then collect it from the
         merchant and pay on the spot, or have it delivered for a fee the merchant sets. Browsing and booking are free.</p>

      <h3>How it works</h3>
      <ol>
        <li>Pick a deal from the list or from the nearby-offers map.</li>
        <li>Book it in one tap and get a booking barcode.</li>
        <li>Collect and pay at the merchant within the booking window.</li>
      </ol>

      <h3>Why TAKI is different from online stores</h3>
      <ul>
        <li>Completely free for buyers — no fees, no subscription, no commission.</li>
        <li>By default you pay the merchant on collection. If you choose online payment, the amount goes straight to the merchant.</li>
        <li>You inspect the goods before paying.</li>
        <li>Collect from the merchant in your city, or choose delivery for a fee the merchant sets.</li>
        <li>Covers every region of Saudi Arabia, most active in Riyadh, Jeddah and Dammam.</li>
      </ul>

      <p>Categories: mall and market offers, restaurant and cafe deals, end-of-season
         sales, White Friday offers, local store discounts, service deals.</p>
    </main>
